<!DOCTYPE html>
<html>
<head>
    <title>Cricket Score Predictor</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <style>
        body {
            padding-top: 50px;
        }
        .container {
            max-width: 900px;
        }
        h1 {
            margin-bottom: 30px;
        }
        .team-image {
            width: 100px;
            height: 100px;
        }
    </style>

    <script>
        function updateTeamImage(team, elementId) {
            const imgElement = document.getElementById(elementId);
            if (team) {
                imgElement.src = `/static/images/${team.toLowerCase().replace(' ', '_')}.png`;
                imgElement.alt = team;
            } else {
                imgElement.src = '';
                imgElement.alt = '';
            }
        }

        $(document).ready(function() {
            // Set images based on selected value (keeps after reload)
            updateTeamImage($('#batting_team').val(), 'batting_team_image');
            updateTeamImage($('#bowling_team').val(), 'bowling_team_image');

            // On dropdown change
            $('#batting_team').change(function() {
                updateTeamImage(this.value, 'batting_team_image');
            });
            $('#bowling_team').change(function() {
                updateTeamImage(this.value, 'bowling_team_image');
            });
        });
    </script>
</head>
<body>
    <div class="container text-center">
        <h1>Cricket Score Predictor</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4 text-center">
                    <img id="batting_team_image" class="team-image" src="" alt="Batting Team">
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="batting_team">Select Batting Team</label>
                        <select class="form-control" name="batting_team" id="batting_team">
                            <option value="" {% if not request.POST.batting_team %}selected{% endif %}>Select Team</option>
                            {% for team in teams %}
                            <option value="{{ team }}" {% if request.POST.batting_team == team %}selected{% endif %}>{{ team }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="bowling_team">Select Bowling Team</label>
                        <select class="form-control" name="bowling_team" id="bowling_team">
                            <option value="" {% if not request.POST.bowling_team %}selected{% endif %}>Select Team</option>
                            {% for team in teams %}
                            <option value="{{ team }}" {% if request.POST.bowling_team == team %}selected{% endif %}>{{ team }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="city">Select City</label>
                        <select class="form-control" name="city" id="city">
                            {% for city in cities %}
                            <option value="{{ city }}" {% if request.POST.city == city %}selected{% endif %}>{{ city }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <img id="bowling_team_image" class="team-image" src="" alt="Bowling Team">
                </div>
            </div>

            <div class="form-group">
                <label for="current_score">Current Score</label>
                <input type="number" class="form-control" name="current_score" id="current_score" required value="{{ request.POST.current_score }}">
            </div>

            <div class="row">
                <div class="col-md-4">
                    <label for="overs">Overs Done</label>
                    <input type="number" step="0.1" class="form-control" name="overs" id="overs" required value="{{ request.POST.overs }}">
                </div>
                <div class="col-md-4">
                    <label for="wickets">Wickets Out</label>
                    <input type="number" class="form-control" name="wickets" id="wickets" required value="{{ request.POST.wickets }}">
                </div>
                <div class="col-md-4">
                    <label for="last_five">Runs in Last 5 Overs</label>
                    <input type="number" class="form-control" name="last_five" id="last_five" required value="{{ request.POST.last_five }}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-4">Predict Score</button>
        </form>

        {% if error %}
        <div class="alert alert-danger mt-4">{{ error }}</div>
        {% endif %}

        {% if prediction %}
        <div class="alert alert-success mt-4">
            <h2>Predicted Score: {{ prediction }}</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
